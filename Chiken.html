<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chicken Road — NowearSpin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
        /* Округлый "дружелюбный" шрифт для чисел-коэффициентов на люках —
           как на референсе казино-игр (крупные жирные скруглённые цифры). */
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap');
        * { box-sizing: border-box; }
        body {
            background: #1a1a1a; color: #fff; font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .balance-pill {
            display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 8px 14px;
            font-weight: 800; font-size: 15px; transition: background .2s;
        }
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #252525;
            padding: 8px;
            overflow: hidden;
            position: relative;
        }
        canvas {
            background-color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        .diff-btn {
            padding: 6px 14px; border-radius: 8px; font-weight: 800; font-size: 12px;
            color: #a1a1aa; transition: all .15s; cursor: pointer; background: transparent; border: none;
        }
        .diff-btn.active { background: #3f3f46; color: #fff; }
        .diff-btn:disabled { cursor: not-allowed; opacity: .5; }
        button:disabled { opacity: .5; cursor: not-allowed; filter: grayscale(.3); }
        input:disabled { opacity: .6; }
        #btn-go, #btn-cashout { transition: transform .1s, filter .15s; }
        #btn-go:active:not(:disabled), #btn-cashout:active:not(:disabled) { transform: scale(0.97); }
        .toast {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,20,0.95); border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 13px;
            opacity: 0; pointer-events: none; transition: opacity .25s, top .25s; z-index: 50;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; top: 24px; }
        .toast.error { border-color: rgba(239,68,68,0.5); color: #fca5a5; }
        .toast.success { border-color: rgba(52,211,153,0.5); color: #6ee7b7; }
        #bet-amount::-webkit-outer-spin-button, #bet-amount::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        #bet-amount { -moz-appearance: textfield; }

        .crash-modal {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none;
            transition: opacity .25s ease; z-index: 60; border-radius: 12px;
        }
        .crash-modal.show { opacity: 1; pointer-events: auto; }
        .crash-modal-card {
            background: #202020; border: 1px solid rgba(255,255,255,0.12); border-radius: 18px;
            padding: 26px 32px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.55);
            transform: scale(0.82); transition: transform .28s cubic-bezier(.34,1.56,.64,1);
        }
        .crash-modal.show .crash-modal-card { transform: scale(1); }
        .crash-modal-img {
            max-width: 130px; max-height: 110px; width: auto; height: auto; object-fit: contain;
            margin: 0 auto 14px; display: block;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.45));
        }
        .crash-modal-title { font-weight: 900; font-size: 22px; color: #f87171; letter-spacing: .4px; }
        .crash-modal-subtitle { font-weight: 700; font-size: 13px; color: #d4d4d8; margin-top: 8px; }

        /* Экран победы/успешного вывода — тот же каркас, что у экрана
           проигрыша, но в зелёной палитре и со своим текстом. */
        .win-modal-title { font-weight: 900; font-size: 22px; color: #34d399; letter-spacing: .4px; }
        .win-modal-subtitle { font-weight: 700; font-size: 13px; color: #d4d4d8; margin-top: 8px; }
        .win-modal-amount { font-weight: 900; font-size: 30px; color: #fbbf24; margin-top: 10px; }
        .win-modal-icon { font-size: 54px; margin: 0 auto 10px; display: block; line-height: 1; }

        @keyframes screenFlash {
            0% { background: rgba(239,68,68,0.35); }
            100% { background: rgba(239,68,68,0); }
        }
        .impact-flash { animation: screenFlash .35s ease-out; }
    </style>
</head>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// Заранее подгружаем нужные начертания шрифта, иначе первые кадры canvas
// рисуют текст стандартным системным шрифтом (то самое "некрасиво") —
// пока веб-шрифт ещё не успел загрузиться через CSS @import.
if (document.fonts && document.fonts.load) {
    Promise.all([
        document.fonts.load("800 25px Inter"),
        document.fonts.load("900 16px Inter"),
        document.fonts.load("800 25px 'Baloo 2'"),
        document.fonts.load("700 16px 'Baloo 2'")
    ]).catch(() => {});
}

const SUPABASE_URL = 'https://xjucalpaoqlrtmofmden.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqdWNhbHBhb3FscnRtb2ZtZGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDIzODcsImV4cCI6MjA5MjAxODM4N30.3jfEF1lSa1YTBYgc4O8ZtJVpfkJN9SBGmqYn8-Sn7Zo';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const userId = String(tg.initDataUnsafe?.user?.id || ('guest_' + Math.floor(Math.random()*100000)));
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Virtual (logical) drawing resolution — actual canvas pixel size is scaled
// by devicePixelRatio below so the game looks crisp on retina/mobile screens.
const VW = 900, VH = 500;

let betType = 'stars';
let difficulty = 'easy';
let myProfile = null;
let currentGameId = null;
let isPlaying = false;
let isBusy = false;        // true while a bet is being placed / a step is animating — blocks double taps
let showCrashChicken = false; // отдельный флаг: показывать задавленную курицу (живёт дольше, чем activeCar.active)
let currentStep = -1;      // last *confirmed* (safely passed) lane, -1 = not started
let pendingStep = -1;      // lane currently being attempted (car mid-air), -1 = none
let currentBet = 0;

// Лестницы выплат по сложности. ВАЖНО: смерть больше НЕ решается случайным
// числом (см. triggerCarLogic ниже) — она зависит только от реального
// положения машины на полосе в момент перехода. Сложность влияет на риск
// косвенно — через скорость трафика (AMBIENT_SPEED_BY_DIFF), которая делает
// безопасные "окна" между машинами короче.
const DIFFICULTIES = {
    easy:   { multipliers: [1.03, 1.08, 1.15, 1.24, 1.35, 1.50, 1.70, 2.00] },
    medium: { multipliers: [1.10, 1.25, 1.45, 1.75, 2.15, 2.70, 3.50, 4.60] },
    hard:   { multipliers: [1.20, 1.50, 2.00, 2.70, 3.80, 5.50, 8.00, 12.0] },
};

function activeConfig() { return DIFFICULTIES[difficulty]; }
function multiplierAt(step) { return activeConfig().multipliers[step]; }

// --- ИСТОЧНИКИ ГРАФИКИ КУРИЦЫ И ДЕКОРА ---
// Картинки лежат в репозитории рядом с этим HTML-файлом (без подпапки).
const imgChicken = new Image();       imgChicken.src = 'chiken.png';
// Задавленная машиной курица — показывается вместо обычной при аварии.
const imgSquashedChicken = new Image(); imgSquashedChicken.src = 'diechik.png';
const imgLvl = new Image();           imgLvl.src = 'cryg.png';
const imgBarrier = new Image();       imgBarrier.src = 'hatch.png';
// Монетка на уже пройденных люках — в репозитории это файл fried_chicken.png
// (несмотря на название, это именно золотая монета с курицей, а не сама курица).
const imgCoin = new Image();          imgCoin.src = 'fried_chicken.png';

const carSources = [
    'car1.png',
    'car2.png',
    'car3.png'
];
const loadedCarImages = carSources.map(src => { const img = new Image(); img.src = src; return img; });
const fallbackCarColors = ['#ef4444', '#3b82f6', '#10b981', '#a855f7'];

let activeCar = { lane: -1, y: -150, targetY: 200, active: false, isCrash: false, imgIndex: 0, sourceRef: null };
let chickenDisplayX = 20; // eased on-screen X position of the chicken, animates towards target lane
let screenShake = 0; // затухающая тряска экрана в момент столкновения

// --- НАСТРОЙКИ СЕТКИ И ДИНАМИЧЕСКОЙ КАМЕРЫ ---
// Люки стоят ближе друг к другу (уже, чем раньше) и сами крупнее — под референс.
const startZoneWidth = 120;
const laneWidth = 112;
const hatchSize = 100;   // диаметр люка на дороге
const hatchFont = 25;    // базовый (максимальный) размер шрифта коэффициента на люке — дальше подгоняется под ширину круга
const HATCH_FONT_STACK = "'Baloo 2', 'Inter', Arial, sans-serif";

// --- ФОНОВЫЙ ТРАФИК ---
// Машины теперь ездят постоянно на каждой полосе (а не только во время
// одного "броска"), и их скорость растёт от сложности и от того, как
// далеко прошла курица — дорога буквально становится опаснее.
const AMBIENT_SPEED_BY_DIFF = { easy: 2.2, medium: 3.1, hard: 4.2 };
let ambientCars = [];
function initAmbientCars() {
    ambientCars = [];
    for (let lane = 0; lane < 8; lane++) {
        ambientCars.push({
            lane,
            y: -150 - Math.random() * 500,
            phase: Math.random() * 300, // сдвиг, чтобы машины не ехали синхронно
            imgIndex: Math.floor(Math.random() * carSources.length)
        });
    }
}
initAmbientCars();

function ambientSpeed() {
    const base = AMBIENT_SPEED_BY_DIFF[difficulty] || 2.2;
    const progressBoost = 1 + Math.max(0, currentStep) * 0.09; // чем дальше курица, тем быстрее машины
    return base * progressBoost;
}

// Габарит машины (высота спрайта) + зазор между машинами в очереди у забора —
// используется, чтобы машины красиво "упирались" друг в друга, а не
// наслаивались одна на другую.
const CAR_HEIGHT = 140;
const QUEUE_GAP = 18;

// Линия, у которой останавливается машина перед закрытым (пройденным) люком.
// Машина должна быть скрыта ЦЕЛИКОМ за верхней границей экрана — если
// показывать даже небольшой её кусок, он неизбежно попадает в ту же
// область, где нарисован забор (0–84px), и визуально накладывается на него.
// Поэтому просто держим машину полностью за кадром, пока полоса закрыта.
function barrierStopY() {
    return -CAR_HEIGHT - 40;
}

// Полоса считается перекрытой забором, если курица её уже прошла — ровно
// так же, как условие отрисовки забора ниже (i <= currentStep && i < 7).
function laneIsBlocked(lane) {
    return lane <= currentStep && lane < 7;
}

function updateAmbientCars() {
    const spd = ambientSpeed();
    const wrapAt = (VH / ZOOM) + 160;
    const stopY = barrierStopY();

    for (let lane = 0; lane < 8; lane++) {
        const laneCars = ambientCars.filter(c => c.lane === lane);

        if (!laneIsBlocked(lane)) {
            // Полоса свободна — обычное сквозное движение с рециклом сверху.
            laneCars.forEach(car => {
                car.y += spd;
                if (car.y > wrapAt) {
                    car.y = -150 - Math.random() * 200;
                    car.imgIndex = Math.floor(Math.random() * carSources.length);
                }
            });
            continue;
        }

        // Полоса перекрыта забором — строим очередь: ближайшая к забору
        // машина едет первой, остальные останавливаются друг за другом.
        laneCars.sort((a, b) => b.y - a.y); // ближе к забору (больше y) — первая в очереди
        let limit = stopY;
        laneCars.forEach(car => {
            // "Отсрочка" даётся РОВНО ОДИН РАЗ — только той машине, которая
            // в момент появления забора уже была ниже (проехала эту точку).
            // Раньше здесь была ошибка: после ухода за экран машина уходила
            // на новый круг (respawn сверху), и с вероятностью ~10% её новая
            // случайная позиция снова оказывалась НИЖЕ stopY — тогда она
            // попадала в этот же "проезжающий" случай повторно и мимо забора
            // проезжала уже НАВСЕГДА, вместо того чтобы встать в очередь.
            // Теперь флаг grace снимается сразу после первого ухода за экран,
            // и на следующем круге машина уже гарантированно встаёт в очередь.
            const inGrace = car.passGrace && car.y > limit;
            if (!inGrace) {
                car.y = Math.min(car.y + spd, limit);
                limit = car.y - (CAR_HEIGHT + QUEUE_GAP);
            } else {
                car.y += spd;
                if (car.y > wrapAt) {
                    car.y = -150 - Math.random() * 300;
                    car.imgIndex = Math.floor(Math.random() * carSources.length);
                    car.passGrace = false; // круг отсрочки закончен — дальше только очередь
                }
            }
        });
    }
}

// ---------- Canvas sizing (fixes blurry / stretched rendering on HiDPI) ----------
function setupCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = VW * dpr;
    canvas.height = VH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
setupCanvas();
window.addEventListener('resize', setupCanvas);

// ---------- Toast helper (replaces blocking alert() calls) ----------
let toastTimer = null;
function showToast(message, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.className = 'toast show ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2400);
}

// Быстрые ставки разные для звёзд и TON — для TON суммы вида 10/50/100
// бессмысленны, нужны дробные значения от 0.1.
const QUICK_BETS = { stars: [10, 50, 100, 500], ton: [0.1, 0.5, 1, 5] };
const QUICK_BET_IDS = ['qb-10', 'qb-50', 'qb-100', 'qb-500'];

function refreshQuickBetButtons() {
    const vals = QUICK_BETS[betType];
    QUICK_BET_IDS.forEach((id, i) => {
        const btn = document.getElementById(id);
        const val = vals[i];
        btn.textContent = betType === 'ton' ? val.toFixed(1) : String(val);
        btn.onclick = () => setBetAmount(val);
    });
}

function switchBetType(t) {
    if (isPlaying || isBusy) return;
    betType = t;
    const activeCls = 'flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl font-black text-xs bg-zinc-700 text-white transition-all';
    const inactiveCls = 'flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl font-black text-xs bg-zinc-800 text-zinc-400 transition-all';
    document.getElementById('tab-stars').className = t === 'stars' ? activeCls : inactiveCls;
    document.getElementById('tab-ton').className = t === 'ton' ? activeCls : inactiveCls;

    // Минимальная ставка и шаг ввода зависят от валюты: у звёзд — целые
    // числа от 1, у TON — дробные от 0.1.
    const inp = document.getElementById('bet-amount');
    if (t === 'ton') {
        inp.min = '0.1';
        inp.step = '0.1';
        inp.value = '0.1';
    } else {
        inp.min = '1';
        inp.step = '1';
        inp.value = '10';
    }
    refreshQuickBetButtons();
}

function switchDifficulty(d) {
    if (isPlaying || isBusy) return;
    difficulty = d;
    ['easy', 'medium', 'hard'].forEach(k => {
        document.getElementById('diff-' + k).classList.toggle('active', k === d);
    });
}

function setControlsDisabled(disabled) {
    document.getElementById('bet-amount').disabled = disabled;
    document.getElementById('tab-stars').disabled = disabled;
    document.getElementById('tab-ton').disabled = disabled;
    document.getElementById('btn-step-down').disabled = disabled;
    document.getElementById('btn-step-up').disabled = disabled;
    document.getElementById('qb-10').disabled = disabled;
    document.getElementById('qb-50').disabled = disabled;
    document.getElementById('qb-100').disabled = disabled;
    document.getElementById('qb-500').disabled = disabled;
    document.getElementById('qb-half').disabled = disabled;
    document.getElementById('qb-double').disabled = disabled;
    document.getElementById('diff-easy').disabled = disabled;
    document.getElementById('diff-medium').disabled = disabled;
    document.getElementById('diff-hard').disabled = disabled;
}

async function loadMe() {
    try {
        let { data, error } = await _supabase.from('users').select('*').eq('user_id', userId).maybeSingle();
        if (error) throw error;

        if (!data) {
            // First time we see this user — create a default row instead of
            // silently failing later when reading myProfile.stars/.balance.
            const { data: created, error: insertErr } = await _supabase
                .from('users')
                .insert({ user_id: userId, stars: 0, balance: 0 })
                .select()
                .single();
            if (insertErr) throw insertErr;
            data = created;
        }

        myProfile = data;
        document.getElementById('my-stars').textContent = Math.round(myProfile.stars || 0);
        document.getElementById('my-ton').textContent = Number(myProfile.balance || 0).toFixed(2);
    } catch (e) {
        console.error(e);
        showToast('Не удалось загрузить профиль', 'error');
    }
}

function stepBet(dir) {
    if (isPlaying || isBusy) return;
    const inp = document.getElementById('bet-amount');
    const minVal = betType === 'ton' ? 0.1 : 1;
    const inc = betType === 'ton' ? 0.1 : 1;
    const v = Math.max(minVal, (parseFloat(inp.value) || 0) + inc * dir);
    inp.value = betType === 'stars' ? Math.round(v) : Math.round(v * 100) / 100;
}

function setBetAmount(v) {
    if (isPlaying || isBusy) return;
    document.getElementById('bet-amount').value = betType === 'stars' ? v : v.toFixed(1);
}

function halveBetAmount() {
    if (isPlaying || isBusy) return;
    const inp = document.getElementById('bet-amount');
    const minVal = betType === 'ton' ? 0.1 : 1;
    const v = Math.max(minVal, (parseFloat(inp.value) || 0) / 2);
    inp.value = betType === 'stars' ? Math.round(v) : Math.round(v * 100) / 100;
}

function doubleBetAmount() {
    if (isPlaying || isBusy) return;
    const inp = document.getElementById('bet-amount');
    const minVal = betType === 'ton' ? 0.1 : 1;
    const v = Math.max(minVal, (parseFloat(inp.value) || 0) * 2);
    inp.value = betType === 'stars' ? Math.round(v) : Math.round(v * 100) / 100;
}

// Постоянный "зум" камеры — вместо того чтобы показывать сразу много полос
// (отчего всё становилось мелким), мы всегда держим в кадре только
// небольшой, близкий отрезок дороги. Это делает люки/машину/курицу заметно
// крупнее, без "прищуривания", как на референсе.
const ZOOM = 1.7;

function renderStaticFields() {
    ctx.clearRect(0, 0, VW, VH);

    // Camera follows whichever lane is furthest along — confirmed step or the one being attempted.
    const focusStep = Math.max(currentStep, pendingStep);
    let cameraX = 0;
    if (focusStep >= 2) cameraX = (focusStep - 1) * laneWidth;

    // Высота видимой области в локальных (немасштабированных) координатах —
    // нужна, чтобы фон/полосы всё ещё покрывали весь экран после zoom.
    const viewH = VH / ZOOM;

    ctx.save();

    if (screenShake > 0.3) {
        const dx = (Math.random() - 0.5) * screenShake;
        const dy = (Math.random() - 0.5) * screenShake;
        ctx.translate(dx, dy);
        screenShake *= 0.82;
    } else {
        screenShake = 0;
    }

    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-cameraX, 0);

    // Асфальт
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(0, 0, startZoneWidth + 8 * laneWidth, viewH);

    // Газон старта
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(0, 0, startZoneWidth - 25, viewH);

    // Бордюр
    ctx.fillStyle = '#666';
    ctx.fillRect(startZoneWidth - 25, 0, 25, viewH);

    for (let i = 0; i < 8; i++) {
        let x = startZoneWidth + i * laneWidth;

        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 6;
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.moveTo(x + laneWidth, 0);
        ctx.lineTo(x + laneWidth, viewH);
        ctx.stroke();

        let hatchX = x + (laneWidth / 2) - hatchSize / 2;
        let hatchY = viewH / 2 - hatchSize / 2;
        const hatchR = hatchSize / 2;

        // Лейн уже полностью пройден (курица шагнула дальше) — вместо люка
        // показываем собранную монетку, как на референсе.
        const alreadyPassed = i < currentStep;
        // Текущий люк, где стоит курица, или ещё не пройденный впереди.
        const confirmed = currentStep >= i;

        if (alreadyPassed) {
            if (imgCoin.complete && imgCoin.naturalWidth) {
                ctx.drawImage(imgCoin, hatchX, hatchY, hatchSize, hatchSize);
            } else {
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath(); ctx.arc(hatchX + hatchR, hatchY + hatchR, hatchR, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#b45309'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(hatchX + hatchR, hatchY + hatchR, hatchR - 3, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = '#92400e';
                ctx.font = `bold ${Math.round(hatchSize * 0.42)}px ${HATCH_FONT_STACK}`;
                ctx.textAlign = 'center';
                ctx.fillText('$', hatchX + hatchR, hatchY + hatchR + hatchSize * 0.14);
            }
            continue;
        }

        if (confirmed) {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath(); ctx.arc(hatchX + hatchR, hatchY + hatchR, hatchR + 3, 0, Math.PI * 2); ctx.fill();
        }

        if (imgLvl.complete && imgLvl.naturalWidth) {
            ctx.drawImage(imgLvl, hatchX, hatchY, hatchSize, hatchSize);
        } else {
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath(); ctx.arc(hatchX + hatchR, hatchY + hatchR, hatchR - 3, 0, Math.PI * 2); ctx.fill();
        }

        ctx.textAlign = 'center';
        const label = multiplierAt(i).toFixed(2) + 'x';
        const maxTextW = hatchSize * 0.78; // не должно вылезать за пределы люка
        let fSize = hatchFont;
        ctx.font = `800 ${fSize}px ${HATCH_FONT_STACK}`;
        while (ctx.measureText(label).width > maxTextW && fSize > 12) {
            fSize -= 1;
            ctx.font = `800 ${fSize}px ${HATCH_FONT_STACK}`;
        }
        const labelX = hatchX + hatchR, labelY = hatchY + hatchR + fSize * 0.32;
        // Обводка + заливка вместо плоского текста — то самое "приятное"
        // написание коэффициента, как на референсе (округлый шрифт с контуром).
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(3, fSize * 0.16);
        ctx.strokeStyle = confirmed ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.55)';
        ctx.strokeText(label, labelX, labelY);
        ctx.fillStyle = confirmed ? '#1a1a1a' : '#fff';
        ctx.fillText(label, labelX, labelY);
    }

    // Заборчики — only behind confirmed lanes
    for (let i = 0; i <= currentStep; i++) {
        if (i < 7) {
            const barrierW = laneWidth - 14;               // крупнее, во всю полосу — как на референсе
            const barrierH = Math.round(barrierW * 0.57);
            let barrierX = startZoneWidth + i * laneWidth + (laneWidth / 2) - barrierW / 2;
            let barrierY = 28;
            if (imgBarrier.complete && imgBarrier.naturalWidth) {
                ctx.drawImage(imgBarrier, barrierX, barrierY, barrierW, barrierH);
            } else {
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(barrierX, barrierY, barrierW, Math.round(barrierH * 0.45));
            }
        }
    }

    // Фоновый трафик — теперь едет постоянно на всех полосах, а не только
    // в момент шага. Машину, которая прямо сейчас "решает" исход текущего
    // шага (activeCar), мы не рисуем здесь дважды — она уже временно
    // изъята из ambientCars в triggerCarLogic и рисуется ниже отдельно.
    ambientCars.forEach(car => {
        let carX = startZoneWidth + car.lane * laneWidth + (laneWidth / 2) - 35;
        let img = loadedCarImages[car.imgIndex];
        if (img && img.complete && img.naturalWidth) {
            ctx.drawImage(img, carX, car.y, 70, 140);
        } else {
            ctx.fillStyle = fallbackCarColors[car.imgIndex] || '#ef4444';
            ctx.fillRect(carX, car.y, 70, 130);
        }
    });

    // Машина испытания (решает исход текущего шага) — взята из фонового
    // потока (см. triggerCarLogic), поэтому визуально она не отличается от
    // остального трафика: та же скорость, та же полоса, тот же спрайт.
    if (activeCar.active) {
        let carX = startZoneWidth + activeCar.lane * laneWidth + (laneWidth / 2) - 35;
        let currentCarImg = loadedCarImages[activeCar.imgIndex];
        if (currentCarImg && currentCarImg.complete && currentCarImg.naturalWidth) {
            ctx.drawImage(currentCarImg, carX, activeCar.y, 70, 140);
        } else {
            ctx.fillStyle = fallbackCarColors[activeCar.imgIndex] || '#ef4444';
            ctx.fillRect(carX, activeCar.y, 70, 130);
            ctx.fillStyle = '#fff';
            ctx.font = `800 11px ${HATCH_FONT_STACK}`;
            ctx.textAlign = 'center';
            ctx.fillText('CAR ' + (activeCar.imgIndex + 1), carX + 35, activeCar.y + 65);
        }
    }

    // Курица — sits on whichever lane is currently being attempted (or the
    // last confirmed one if idle). activeCar.active теперь выставляется
    // ТОЛЬКО когда переход закончится столкновением (безопасные переходы
    // подтверждаются мгновенно, без анимации activeCar) — поэтому курица
    // сразу стоит там, где её должна догнать машина.
    let chickenLane = pendingStep >= 0 ? pendingStep : currentStep;
    let chickenTargetX = chickenLane >= 0 ? startZoneWidth + chickenLane * laneWidth + (laneWidth / 2) - 45 : 20;
    chickenDisplayX += (chickenTargetX - chickenDisplayX) * 0.18;
    if (Math.abs(chickenTargetX - chickenDisplayX) < 0.5) chickenDisplayX = chickenTargetX;

    const hopDist = Math.abs(chickenTargetX - chickenDisplayX);
    const hopOffset = Math.min(16, hopDist * 0.22);

    let chickenX = chickenDisplayX;
    let chickenY = viewH / 2 - 45 - hopOffset;

    const showFried = showCrashChicken;
    if (showFried) {
        if (imgSquashedChicken.complete && imgSquashedChicken.naturalWidth) {
            ctx.drawImage(imgSquashedChicken, chickenX, chickenY, 90, 90);
        } else {
            ctx.fillStyle = '#ff7800';
            ctx.fillRect(chickenX, chickenY, 90, 90);
        }
    } else {
        if (imgChicken.complete && imgChicken.naturalWidth) {
            ctx.drawImage(imgChicken, chickenX, chickenY, 90, 90);
        } else {
            ctx.fillStyle = '#eab308';
            ctx.fillRect(chickenX, chickenY, 90, 90);
        }

        // Плавающий бейдж с текущим коэффициентом под курицей — как на референсе.
        if (isPlaying && currentStep >= 0 && !activeCar.active) {
            const label = multiplierAt(currentStep).toFixed(2) + 'x';
            ctx.font = `800 16px ${HATCH_FONT_STACK}`;
            const textW = ctx.measureText(label).width;
            const badgeW = textW + 24, badgeH = 30;
            const badgeX = chickenX + 45 - badgeW / 2;
            const badgeY = chickenY + 96;
            ctx.fillStyle = '#1d4ed8';
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 8) : ctx.rect(badgeX, badgeY, badgeW, badgeH);
            ctx.fill();
            ctx.textAlign = 'center';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.strokeText(label, chickenX + 45, badgeY + badgeH / 2 + 6);
            ctx.fillStyle = '#fff';
            ctx.fillText(label, chickenX + 45, badgeY + badgeH / 2 + 6);
        }
    }

    ctx.restore();
}

function updateLoop() {
    updateAmbientCars();   // фоновый трафик теперь реально едет каждый кадр
    renderStaticFields();
    requestAnimationFrame(updateLoop);
}

async function pressGo() {
    if (isBusy || activeCar.active) return;

    if (!isPlaying) {
        isBusy = true;
        try {
            const inp = document.getElementById('bet-amount');
            const amount = parseFloat(inp.value);

            if (!amount || amount <= 0) { showToast('Введите ставку', 'error'); return; }
            const minBet = betType === 'ton' ? 0.1 : 1;
            if (amount < minBet) {
                showToast(`Минимальная ставка: ${minBet} ${betType === 'stars' ? '⭐' : '💎'}`, 'error');
                return;
            }

            await loadMe();
            if (!myProfile) return;

            const field = betType === 'stars' ? 'stars' : 'balance';
            if (amount > (myProfile[field] || 0)) { showToast('Недостаточно средств!', 'error'); return; }

            // 1) Сначала создаём запись игры. Если это не удастся — деньги
            //    ещё не тронуты, значит их не потеряем.
            const { data: gameSession, error: insertErr } = await _supabase.from('chicken_games').insert({
                user_id: userId, bet_amount: amount, bet_type: betType, difficulty, status: 'playing'
            }).select().single();
            if (insertErr) throw insertErr;

            // 2) Теперь списываем ставку. Если списание не удастся — откатываем
            //    созданную игру, чтобы не остаться с "висящей" записью.
            const { error: updateErr } = await _supabase.from('users')
                .update({ [field]: myProfile[field] - amount })
                .eq('user_id', userId);
            if (updateErr) {
                await _supabase.from('chicken_games').delete().eq('id', gameSession.id);
                throw updateErr;
            }

            currentGameId = gameSession.id;
            currentBet = amount;
            isPlaying = true;
            currentStep = -1;
            pendingStep = -1;
            chickenDisplayX = 20;
            hideCrashModal();
            hideWinModal();
            showCrashChicken = false;
            // Полностью пересоздаём фоновый трафик на старте каждого раунда.
            // Раньше машины и их флаги (passGrace, положение в очереди у
            // забора) оставались от предыдущего раунда — из-за этого могло
            // казаться, что перегородка "не встала" (машина с прошлого
            // раунда уже стояла в неожиданном месте) и курицу сбивало без
            // видимой причины. Теперь каждый раунд стартует с чистого листа.
            activeCar = { lane: -1, y: -150, targetY: 200, active: false, isCrash: false, imgIndex: 0, sourceRef: null };
            initAmbientCars();

            document.getElementById('btn-go').innerText = 'GO';
            document.getElementById('btn-cashout').classList.remove('hidden');
            document.getElementById('cashout-preview').innerText = '';
            setControlsDisabled(true);

            await loadMe();
            triggerCarLogic(0);
        } catch (e) {
            console.error(e);
            const msg = (e && (e.message || e.details || e.hint)) || 'Ошибка соединения, попробуйте снова';
            showToast(msg, 'error');
        } finally {
            isBusy = false;
        }
    } else {
        if (currentStep < 7) {
            triggerCarLogic(currentStep + 1);
        }
    }
}

// Исход шага больше НЕ решает Math.random(). Смерть происходит только если
// машина на этой полосе реально ещё не проехала точку, где стоит курица —
// т.е. если сейчас шагнуть, курица физически окажется прямо на пути машины.
// Если машина этой полосы УЖЕ проехала точку курицы к моменту нажатия — переход
// гарантированно безопасен, и это можно честно увидеть на экране заранее
// (трафик едет постоянно, независимо от нажатий).
//
// Раньше здесь был отдельный баг: если "приближающейся" машины не находилось,
// код искусственно телепортировал существующую машину обратно наверх (y=-150),
// из-за чего игрок иногда видел, как машина уже "проехала мимо", а курица всё
// равно погибала на следующем нажатии — потому что на самом деле смерть решал
// не экран, а скрытый рандом. Теперь такого рассинхрона в принципе быть не
// может: одна полоса — всегда ровно одна машина, её положение не подменяется,
// и именно оно определяет исход.
function triggerCarLogic(step) {
    isBusy = true;
    pendingStep = step;

    const hitY = (VH / ZOOM) / 2 - 55;   // точка на дороге, где стоит курица
    const passAfterHitY = hitY + 40;     // машина должна проехать НИЖЕ этой линии, чтобы считаться "уже проехавшей"

    const resolvingCar = ambientCars.find(c => c.lane === step);

    // Реальная (не случайная!) проверка: машина ещё не миновала курицу?
    // Если машины на полосе вообще нет (крайне маловероятный edge case —
    // в норме на каждой полосе всегда ровно одна машина), считаем переход
    // безопасным: сбивать курицу физически нечему.
    const isCrash = !!resolvingCar && resolvingCar.y < passAfterHitY;

    if (!isCrash) {
        // Машина этой полосы уже позади — шаг безопасен сразу, без анимации
        // "решающей" машины. Курица просто перебегает (плавный переход к
        // новой полосе уже сделан через chickenDisplayX в рендере).
        // Помечаем машину passGrace=true: полоса становится заблокированной
        // ПРЯМО СЕЙЧАС, а машина всё ещё где-то по центру экрана (только
        // проехала курицу) — ей нужно спокойно доехать и уйти за экран, а не
        // резко телепортироваться назад к забору. Но это разовая поблажка:
        // на следующем же круге (после респавна сверху) она встанет в
        // очередь как положено (см. updateAmbientCars).
        if (resolvingCar) resolvingCar.passGrace = true;

        currentStep = step;
        pendingStep = -1;
        isBusy = false;

        const currentMult = multiplierAt(currentStep);
        document.getElementById('cashout-preview').innerText =
            `(${(currentBet * currentMult).toFixed(2)} ${betType === 'stars' ? '⭐' : '💎'})`;
        tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light');
        if (currentStep === 7) cashOut();
        return;
    }

    // Машина ещё не проехала курицу — забираем её из фонового потока и
    // честно анимируем реальное столкновение на её текущих координатах.
    // (resolvingCar здесь гарантированно существует: если бы её не было,
    // isCrash уже был бы false и мы бы вышли выше через return.)
    ambientCars.splice(ambientCars.indexOf(resolvingCar), 1);

    activeCar.lane = step;
    activeCar.y = resolvingCar.y;
    activeCar.imgIndex = resolvingCar.imgIndex;
    activeCar.active = true;
    activeCar.isCrash = true;
    activeCar.sourceRef = resolvingCar;

    let safetyFrames = 0;
    function animate() {
        if (!activeCar.active) return;
        activeCar.y += ambientSpeed(); // та же скорость, что у всего трафика — машина не выделяется
        safetyFrames++;

        // Страховка: если по какой-то причине (например, вкладка была
        // свёрнута и requestAnimationFrame надолго "залипал") машина не
        // доезжает до курицы за разумное время — не даём игре зависнуть
        // с заблокированными кнопками, а честно завершаем шаг столкновением.
        if (activeCar.y >= hitY || safetyFrames > 900) {
            activeCar.y = hitY;
            activeCar.active = false;
            triggerImpact(step);
            return;
        }
        requestAnimationFrame(animate);
    }

    tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light');
    animate();
}

// Разыгрывает сам момент удара: сначала машина останавливается вплотную к
// курице и экран трясётся (видно, что произошло столкновение), и только
// СПУСТЯ короткую паузу спрайт курицы меняется на задавленную — раньше эта
// подмена происходила в тот же кадр, что и остановка машины, из-за чего не
// было видно самого "наезда". Ещё через паузу — итоговая модалка.
function triggerImpact(step) {
    tg.HapticFeedback && tg.HapticFeedback.impactOccurred('heavy');
    screenShake = 14;

    setTimeout(() => {
        showCrashChicken = true;
        tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error');
        setTimeout(() => handleCrash(step), 550);
    }, 220);
}

function showCrashModal() {
    document.getElementById('crash-modal').classList.add('show');
}

function hideCrashModal() {
    document.getElementById('crash-modal').classList.remove('show');
}

function showWinModal(amount, currency, isFullRun) {
    document.getElementById('win-modal-title').textContent = isFullRun ? 'Полная победа! 🐔🏆' : 'Забрано!';
    document.getElementById('win-modal-amount').textContent = `+${amount.toFixed(2)} ${currency}`;
    document.getElementById('win-modal-subtitle').textContent = isFullRun
        ? 'Курица добралась до конца целой и невредимой!'
        : 'Успешный вывод — курица цела!';
    document.getElementById('win-modal').classList.add('show');
}

function hideWinModal() {
    document.getElementById('win-modal').classList.remove('show');
}

async function handleCrash(step) {
    isPlaying = false;
    document.getElementById('btn-go').innerText = 'PLAY';
    document.getElementById('btn-cashout').classList.add('hidden');
    showCrashModal();

    try {
        await _supabase.from('chicken_games').update({
            status: 'crashed', max_multiplier: multiplierAt(step)
        }).eq('id', currentGameId);
        await loadMe();
    } catch (e) {
        console.error(e);
    } finally {
        // Держим модалку и задавленную курицу на экране подольше, чтобы
        // результат был явно виден, и только потом сбрасываем поле.
        setTimeout(() => {
            // Машина, которая нас "сбила", была временно изъята из
            // ambientCars — возвращаем её обратно в поток, иначе трафик со
            // временем поредеет.
            if (activeCar.sourceRef) {
                ambientCars.push({ lane: activeCar.lane, y: -150 - Math.random() * 200, imgIndex: activeCar.imgIndex });
                activeCar.sourceRef = null;
            }
            currentStep = -1;
            pendingStep = -1;
            chickenDisplayX = 20;
            showCrashChicken = false;
            hideCrashModal();
            isBusy = false;
            setControlsDisabled(false);
        }, 1900);
    }
}

async function cashOut() {
    if (!isPlaying || activeCar.active) return;
    isPlaying = false;
    document.getElementById('btn-go').innerText = 'PLAY';
    document.getElementById('btn-cashout').classList.add('hidden');
    setControlsDisabled(true); // блокируем управление, пока показан экран победы

    let finalMultiplier = multiplierAt(currentStep);
    const winAmount = Math.round(currentBet * finalMultiplier * 100) / 100;
    const isFullRun = currentStep === 7;

    try {
        await _supabase.from('chicken_games').update({
            status: 'cashed_out', max_multiplier: finalMultiplier
        }).eq('id', currentGameId);

        const field = betType === 'stars' ? 'stars' : 'balance';
        await _supabase.from('users').update({
            [field]: (myProfile[field] || 0) + winAmount
        }).eq('user_id', userId);

        tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
        showWinModal(winAmount, betType === 'stars' ? '⭐' : '💎', isFullRun);
        await loadMe();
    } catch (e) {
        console.error(e);
        showToast('Ошибка при выводе средств', 'error');
    } finally {
        // Держим экран победы на экране, как и экран проигрыша, чтобы
        // результат было явно видно, и только потом сбрасываем поле.
        setTimeout(() => {
            currentStep = -1;
            pendingStep = -1;
            chickenDisplayX = 20;
            hideWinModal();
            isBusy = false;
            setControlsDisabled(false);
        }, 1900);
    }
}

updateLoop();
loadMe();
refreshQuickBetButtons();
</script>
