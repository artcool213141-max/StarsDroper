<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NowearSpin - Gold Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { 
            --accent: #f5b025; 
            --accent-hover: #c68c16; 
            --accent-gradient: linear-gradient(135deg, #fbe3a8 0%, #f5b025 50%, #c68c16 100%);
            --bg: #000000; 
        }
        
        * { -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body { 
            background: var(--bg); color: white; font-family: 'Inter', sans-serif; 
            margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; 
            position: relative;
        }

        #stars-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .content-wrapper { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; flex: 1; min-height: 0; }

        .header-panel { 
            padding: 12px 16px; background: rgba(10, 10, 10, 0.6); border-bottom: 1px solid rgba(245, 176, 37, 0.12); 
            padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px));
            backdrop-filter: blur(10px);
        }

        /* --- Единая тап-анимация --- */
        .tap-bounce { transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s ease, box-shadow 0.15s ease, color 0.15s ease; }
        .tap-bounce:active { transform: scale(0.92); }

        #wheels-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; overflow: hidden; }

        .wheel-track { 
            position: relative; width: 100%; height: 90px; overflow: hidden; 
            border-top: 1px solid rgba(245, 176, 37, 0.2); border-bottom: 1px solid rgba(245, 176, 37, 0.2);
            background: rgba(245, 176, 37, 0.02);
            border-radius: 14px;
        }

        .pointer { 
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); 
            width: 3px; height: 100%; background: var(--accent); z-index: 50; 
            box-shadow: 0 0 15px var(--accent);
        }

        .wheel-line { display: flex; align-items: center; height: 100%; will-change: transform; }

        .item { 
            min-width: 80px; height: 80px; margin: 0 4px; background: rgba(255, 255, 255, 0.02); 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            border: 1px solid rgba(245, 176, 37, 0.1);
        }
        .item img { width: 55px; height: 55px; object-fit: contain; }

        .btn-main { 
            background: var(--accent-gradient); color: #000; font-weight: 900; border-radius: 18px; 
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 5px 25px rgba(245, 176, 37, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-main:active { transform: scale(0.95); }
        .btn-main:disabled { opacity: 0.3; filter: grayscale(1); }

        .multi-btn { background: rgba(245, 176, 37, 0.04); border: 1px solid rgba(245, 176, 37, 0.1); padding: 10px 0; border-radius: 12px; flex: 1; font-weight: 900; font-size: 12px; color: #6b5c38; transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease; }
        .multi-btn.active { border-color: var(--accent); background: rgba(245, 176, 37, 0.12); color: white; box-shadow: 0 0 10px rgba(245, 176, 37, 0.25); }
        .multi-btn:active { transform: scale(0.9); }

        .skip-wrap { display: none; justify-content: center; padding-bottom: 6px; }
        .skip-wrap.show { display: flex; }
        .skip-btn {
            padding: 9px 26px; border-radius: 999px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            color: #d7cbb0; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em;
        }
        .skip-btn:active { background: rgba(255,255,255,0.1); }

        #win-modal, #sub-modal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0, 0, 0, 0.96); backdrop-filter: blur(10px); align-items: center; justify-content: center; }
        .modal-box { background: rgba(20,20,20,0.9); border: 1px solid var(--accent); border-radius: 24px; width: 85%; padding: 25px; text-align: center; box-shadow: 0 0 40px rgba(245, 176, 37, 0.2); animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .win-item-card { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .sub-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, #34b7f1, #1c93cf); color: #fff; font-weight: 900;
            border-radius: 16px; padding: 14px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;
            box-shadow: 0 5px 20px rgba(52, 183, 241, 0.25); border: 1px solid rgba(255,255,255,0.1);
        }
        .confirm-btn {
            background: var(--accent-gradient); color: #000; font-weight: 900; border-radius: 16px;
            padding: 14px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
        }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>

    <div class="content-wrapper">
        <header class="header-panel flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="tap-bounce flex items-center justify-center w-8 h-8 rounded-full bg-black/40 border border-white/10">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-[#f5b025]">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="font-black italic text-lg tracking-tighter uppercase">Nowear<span class="text-[#f5b025]">Spin</span></div>
            </div>
            
            <div class="flex items-center gap-2 bg-black/40 px-4 py-1.5 rounded-full border border-[#f5b025]/25 shadow-[0_0_10px_rgba(245,176,37,0.08)]">
                <img src="img/star.png" class="w-4 h-4" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
                <span id="val-stars" class="font-black text-sm text-[#f5b025]">0</span>
            </div>
        </header>

        <div id="wheels-container"></div>

        <div class="p-6 bg-black/40 border-t border-[#f5b025]/10">
            <div id="skip-wrap" class="skip-wrap">
                <button onclick="skipSpin()" class="skip-btn tap-bounce">Пропустить ⏭</button>
            </div>
            <div id="multi-wrap" class="flex gap-2 mb-4">
                <button onclick="setMulti(1)" class="multi-btn tap-bounce active" data-m="1">X1</button>
                <button onclick="setMulti(2)" class="multi-btn tap-bounce" data-m="2">X2</button>
                <button onclick="setMulti(3)" class="multi-btn tap-bounce" data-m="3">X3</button>
                <button onclick="setMulti(4)" class="multi-btn tap-bounce" data-m="4">X4</button>
                <button onclick="setMulti(5)" class="multi-btn tap-bounce" data-m="5">X5</button>
            </div>
            <button id="spin-btn" onclick="startSpin()" class="w-full py-4 btn-main uppercase tracking-widest text-sm">Подключение...</button>
        </div>
    </div>

    <div id="win-modal">
        <div class="modal-box">
            <h2 class="text-xl font-black italic uppercase text-[#f5b025] tracking-wider">Отличный улов!</h2>
            <p class="text-[11px] text-gray-400 uppercase font-medium mt-1">Твои награды:</p>
            
            <div id="win-items-container" class="grid grid-cols-3 gap-2 my-5"></div>
            
            <p class="text-[11px] text-gray-400 uppercase font-bold mb-5">Общая ценность: <span id="total-win-price" class="text-[#f5b025] text-sm">0</span> ★</p>
            
            <button onclick="claimPrize('sell')" id="sell-btn" class="tap-bounce w-full bg-gradient-to-r from-[#fbe3a8] via-[#f5b025] to-[#c68c16] text-black py-4 rounded-xl font-black uppercase text-xs mb-3 shadow-lg shadow-amber-500/10 tracking-wider">Продать и забрать монеты</button>
            <button onclick="claimPrize('keep')" id="keep-btn" class="tap-bounce w-full bg-white/5 text-gray-300 py-4 rounded-xl font-bold uppercase text-[10px] tracking-wider border border-white/5">Оставить в рюкзаке</button>
        </div>
    </div>

    <!-- Модалка подписки на канал (только для бесплатного спина) -->
    <div id="sub-modal">
        <div class="modal-box">
            <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-[#34b7f1]/15 flex items-center justify-center border border-[#34b7f1]/30">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="#34b7f1"><path d="M21.9 2.7c.3-1.2-.6-1.9-1.5-1.5L1.3 9.4c-.9.4-.9 1.9.1 2.1l4.7 1.5 1.8 5.8c.2.7 1.1.9 1.6.4l2.6-2.4 4.8 3.6c.7.5 1.7.1 1.9-.8L21.9 2.7z"/></svg>
            </div>
            <h2 class="text-lg font-black italic uppercase text-white tracking-wider">Почти готово!</h2>
            <p class="text-[12px] text-gray-400 mt-2 mb-5 leading-relaxed">Чтобы получить <span class="text-[#f5b025] font-bold">бесплатный спин</span>, подпишись на наш канал — там дропы, промокоды и новости проекта.</p>

            <button onclick="openChannel()" class="sub-btn tap-bounce w-full mb-3">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 2.7c.3-1.2-.6-1.9-1.5-1.5L1.3 9.4c-.9.4-.9 1.9.1 2.1l4.7 1.5 1.8 5.8c.2.7 1.1.9 1.6.4l2.6-2.4 4.8 3.6c.7.5 1.7.1 1.9-.8L21.9 2.7z"/></svg>
                Подписаться
            </button>
            <button onclick="confirmSubscription()" class="confirm-btn tap-bounce w-full">Я подписался</button>
        </div>
    </div>

<script>
    const SB_URL = "https://xjucalpaoqlrtmofmden.supabase.co";
    const SB_KEY = "sb_publishable_SaK4-9Ub_yQQez5F-eUq3A_NPx46axx";
    const SB = supabase.createClient(SB_URL, SB_KEY);
    const tg = window.Telegram.WebApp;

    tg.expand();
    tg.enableClosingConfirmation();

    const CHANNEL_URL = "https://t.me/nowear_free";
    const SUB_KEY = "nowearspin_sub_confirmed_at";
    const SUB_TTL = 86400000; // 24 часа

    const ALL_ITEMS = {
        "star": { price: 5, img: "star.png", rarity: 1.6 },
        "raketa.png": { price: 50, img: "raketa.png", rarity: 93 },
        "2025.jpg": { price: 500, img: "2025.jpg", rarity: 5 },
        "bear.png": { price: 3500, img: "bear.png", rarity: 0.1 },
        "car.png": { price: 5000, img: "car.png", rarity: 0.1 },
        "helmet.png": { price: 25000, img: "helmet.png", rarity: 0.1 },
        "kepka.png": { price: 100000, img: "kepka.png", rarity: 0.1 }
    };

    const ALL_KEYS = Object.keys(ALL_ITEMS);
    let user = null, isSpinning = false, multi = 1, currentWins = [];
    let spinTimeoutId = null;
    const VIP_ID = 1373624995;

    // --- Функция рандома по весу (rarity) ---
    function getRandomItemKey(isFree = false) {
        let pool = { ...ALL_ITEMS };
        
        // Если бесплатный спин, урезаем шанс дорогих предметов, чтобы падала мелочь
        if (isFree) {
            pool["2025.jpg"].rarity = 1;
            pool["bear.png"].rarity = 0;
            pool["car.png"].rarity = 0;
            pool["helmet.png"].rarity = 0;
            pool["kepka.png"].rarity = 0;
        }

        const totalWeight = Object.values(pool).reduce((sum, item) => sum + item.rarity, 0);
        let randomNum = Math.random() * totalWeight;

        for (const key of Object.keys(pool)) {
            if (randomNum < pool[key].rarity) {
                return key;
            }
            randomNum -= pool[key].rarity;
        }
        return "star"; // Дефолт на крайний случай
    }

    // --- Подписка на канал ---
    function isSubConfirmed() {
        const raw = localStorage.getItem(SUB_KEY);
        if (!raw) return false;
        return (Date.now() - parseInt(raw, 10)) < SUB_TTL;
    }

    function openChannel() {
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        if (tg.openTelegramLink) tg.openTelegramLink(CHANNEL_URL);
        else window.open(CHANNEL_URL, '_blank');
    }

    function showSubModal() {
        document.getElementById('sub-modal').style.display = 'flex';
    }

    function hideSubModal() {
        document.getElementById('sub-modal').style.display = 'none';
    }

    function confirmSubscription() {
        localStorage.setItem(SUB_KEY, Date.now().toString());
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        hideSubModal();
        runSpin();
    }

    async function syncBalance() {
        if (!user) return;
        const { data, error } = await SB.from('users').select('stars').eq('user_id', user.user_id).single();
        if (!error && data) {
            user.stars = data.stars;
            document.getElementById('val-stars').innerText = Math.floor(user.stars);
        }
    }

    async function checkAuth() {
        let userId = tg.initDataUnsafe?.user?.id || 8015661230;
        let { data, error } = await SB.from('users').select('*').eq('user_id', userId).single();
        if (error || !data) {
            const { data: newUser } = await SB.from('users').insert([{ user_id: userId, stars: 0, inventory: [], spin_count: 0 }]).select().single();
            data = newUser;
        }
        user = data;
        document.getElementById('val-stars').innerText = Math.floor(user.stars || 0);
        updateUI();
    }

    function updateUI() {
        if (!user) return;
        const lastFree = user.last_free_spin ? new Date(user.last_free_spin).getTime() : 0;
        const isFree = (Date.now() - lastFree) > 86400000;
        const btn = document.getElementById('spin-btn');
        if (isFree) {
            btn.innerText = "ХАЛЯВНЫЙ СПИН";
            btn.style.background = "#10b981";
        } else {
            const cost = 100 * multi;
            btn.innerText = `ИСПЫТАТЬ УДАЧУ ЗА ${cost} ★`;
            btn.disabled = isSpinning || (user.stars < cost);
        }
        if (!isSpinning) initWheels();
    }

    function initWheels() {
        const container = document.getElementById('wheels-container');
        container.innerHTML = '';
        for(let i=0; i<(multi > 1 ? multi : 1); i++) {
            let content = '';
            for(let j=0; j<140; j++) {
                const k = ALL_KEYS[Math.floor(Math.random()*ALL_KEYS.length)];
                const imgName = ALL_ITEMS[k].img.startsWith('img/') ? ALL_ITEMS[k].img : `img/${ALL_ITEMS[k].img}`;
                content += `<div class="item"><img src="${imgName}" onerror="this.src='img/star.png'"></div>`;
            }
            container.innerHTML += `<div class="wheel-track"><div class="pointer"></div><div class="wheel-line" id="line-${i}">${content}</div></div>`;
        }
    }

    async function startSpin() {
        await syncBalance();
        if (isSpinning || !user) return;

        const lastFree = user.last_free_spin ? new Date(user.last_free_spin).getTime() : 0;
        const isFree = (Date.now() - lastFree) > 86400000;

        if (isFree && !isSubConfirmed()) {
            showSubModal();
            return;
        }

        runSpin();
    }

    async function runSpin() {
        if (isSpinning || !user) return;

        const lastFree = user.last_free_spin ? new Date(user.last_free_spin).getTime() : 0;
        const isFree = (Date.now() - lastFree) > 86400000;
        const spinsToRun = isFree ? 1 : multi; 
        const cost = isFree ? 0 : 100 * spinsToRun;

        if (!isFree && user.stars < cost) return tg.showAlert("Мало звезд!");

        isSpinning = true;
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        document.getElementById('spin-btn').disabled = true;
        document.getElementById('skip-wrap').classList.add('show');
        currentWins = [];

        let currentSpinCount = (user.spin_count || 0) + 1;

        // Генерация призов по честным шансам из ALL_ITEMS
        for (let i = 0; i < spinsToRun; i++) {
            const winKey = getRandomItemKey(isFree);
            currentWins.push(ALL_ITEMS[winKey]);

            // Установка картинки на финальное 130-е место в треке рулетки
            const targetImgPath = ALL_ITEMS[winKey].img.startsWith('img/') ? ALL_ITEMS[winKey].img : `img/${ALL_ITEMS[winKey].img}`;
            document.getElementById(`line-${i}`).querySelectorAll('img')[130].src = targetImgPath;
        }

        // Сохранение в БД
        const upd = isFree 
            ? { last_free_spin: new Date().toISOString(), spin_count: currentSpinCount } 
            : { stars: user.stars - cost, spin_count: currentSpinCount };
            
        await SB.from('users').update(upd).eq('user_id', user.user_id);
        user.spin_count = currentSpinCount;

        for (let i = 0; i < spinsToRun; i++) {
            document.getElementById(`line-${i}`).style.transition = `transform ${7 + (i * 0.4)}s cubic-bezier(0.1, 0, 0, 1)`;
            document.getElementById(`line-${i}`).style.transform = `translateX(-${(130 * 88) - (window.innerWidth / 2) + 44}px)`;
        }

        if (spinTimeoutId) clearTimeout(spinTimeoutId);
        spinTimeoutId = setTimeout(showModal, 8000);
    }

    function skipSpin() {
        if (!isSpinning) return;
        if (spinTimeoutId) { clearTimeout(spinTimeoutId); spinTimeoutId = null; }
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        showModal();
    }

    function showModal() {
        document.getElementById('skip-wrap').classList.remove('show');
        const container = document.getElementById('win-items-container');
        container.innerHTML = '';
        let total = 0;
        currentWins.forEach((w, i) => {
            total += w.price;
            const itemImgPath = w.img.startsWith('img/') ? w.img : `img/${w.img}`;
            container.innerHTML += `<div class="win-item-card bg-white/5 p-2 rounded-xl border border-[#f5b025]/20" style="animation-delay:${i * 0.08}s"><img src="${itemImgPath}" class="w-10 h-10 mx-auto" onerror="this.src='img/star.png'"><p class="text-[10px] font-black text-[#f5b025] mt-1">${w.price}★</p></div>`;
        });
        document.getElementById('total-win-price').innerText = total;
        document.getElementById('win-modal').style.display = 'flex';
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    async function claimPrize(type) {
        await syncBalance();
        const sum = currentWins.reduce((s, w) => s + w.price, 0);
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        if (type === 'sell') await SB.from('users').update({ stars: user.stars + sum }).eq('user_id', user.user_id);
        else {
            const inv = user.inventory || [];
            currentWins.forEach(w => inv.push({...w, id: Date.now() + Math.random()}));
            await SB.from('users').update({ inventory: inv }).eq('user_id', user.user_id);
        }
        location.reload();
    }

    function setMulti(m) {
        multi = m;
        if (tg.HapticFeedback) (tg.HapticFeedback.selectionChanged ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred('light'));
        document.querySelectorAll('.multi-btn').forEach(b => b.classList.toggle('active', b.dataset.m == m));
        updateUI();
    }
    window.addEventListener('focus', syncBalance);

    // --- Летающие частицы на фоне ---
    function initParticles() {
        const canvas = document.getElementById('stars-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let w, h, particles;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function makeParticles() {
            const count = Math.floor((w * h) / 22000);
            particles = Array.from({ length: count }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.3 + 0.3,
                vy: Math.random() * 0.15 + 0.03,
                vx: (Math.random() - 0.5) * 0.08,
                alpha: Math.random() * 0.5 + 0.2,
                twinkle: Math.random() * 0.02 + 0.005,
                dir: Math.random() > 0.5 ? 1 : -1
            }));
        }

        function tick() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.alpha += p.twinkle * p.dir;
                if (p.alpha >= 0.8 || p.alpha <= 0.15) p.dir *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(245, 176, 37, ${p.alpha})`;
                ctx.fill();

                p.y -= p.vy;
                p.x += p.vx;
                if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
                if (p.x < -5) p.x = w + 5;
                if (p.x > w + 5) p.x = -5;
            });
            requestAnimationFrame(tick);
        }

        resize();
        makeParticles();
        tick();
        window.addEventListener('resize', () => { resize(); makeParticles(); });
    }

    initParticles();
    checkAuth();
</script>
</body>
</html>
