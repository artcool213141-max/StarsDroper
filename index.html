<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Maintenance | System Access</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f7ef8a;
            --dark: #0a0a0a;
        }

        body {
            background: var(--dark);
            color: var(--gold);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            background: linear-gradient(145deg, #1a1a1a, #000);
        }

        h1 { text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; }

        input {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px;
            text-align: center;
            font-size: 1.2rem;
            border-radius: 5px;
            width: 150px;
            margin-bottom: 20px;
        }

        button {
            background: var(--gold);
            color: var(--dark);
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover { background: var(--gold-light); transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <h1>TECHNICAL BREAK</h1>
    <p>Доступ ограничен. Введите код администратора:</p>
    <input type="password" id="code" maxlength="4" placeholder="****">
    <br>
    <button onclick="checkCode()">ВОЙТИ</button>
</div>

<script>
    function checkCode() {
        const input = document.getElementById('code').value;
        if (input === "3330") {
            window.location.href = "global.html";
        } else {
            alert("Неверный код доступа!");
            document.getElementById('code').value = "";
        }
    }
</script>

</body>
</html>
