<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOWEARSPIN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f0f0f;
    color:#fff;
    overflow:hidden;
    padding:15px;
}

.glow{
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    background:#ffc400;
    filter:blur(140px);
    opacity:.15;
}

.card{
    width:100%;
    max-width:420px;
    padding:30px 24px;
    text-align:center;
    border-radius:24px;
    background:rgba(255,196,0,.05);
    border:1px solid rgba(255,196,0,.12);
    backdrop-filter:blur(12px);
    box-shadow:0 0 40px rgba(255,196,0,.08);
    position:relative;
    z-index:1;
}

.logo{
    font-size:30px;
    font-weight:900;
    color:#ffc400;
    letter-spacing:1px;
}

.line{
    width:60px;
    height:3px;
    background:#ffc400;
    margin:14px auto 24px;
    border-radius:999px;
}

.icon{
    font-size:42px;
    margin-bottom:18px;
}

.title{
    font-size:24px;
    font-weight:700;
    margin-bottom:14px;
}

.text{
    font-size:14px;
    line-height:1.8;
    color:#d0d0d0;
}

.badge{
    display:inline-block;
    margin-top:24px;
    padding:10px 18px;
    border-radius:999px;
    background:#ffc400;
    color:#111;
    font-size:13px;
    font-weight:700;
}

.footer{
    margin-top:18px;
    font-size:12px;
    color:#888;
}
</style>
</head>
<body>

<div class="glow"></div>

<div class="card">

    <div class="logo">NOWEARSPIN</div>

    <div class="line"></div>

    <div class="icon">⚙️</div>

    <div class="title">Технические работы</div>

    <div class="text">
        Сейчас на платформе проводятся плановые технические работы.
        <br><br>
        Мы обновляем систему, повышаем стабильность сервиса и готовим новые возможности.
        <br><br>
        Пожалуйста, зайдите немного позже.
    </div>

    <div class="badge">🚀 Скоро вернёмся</div>

    <div class="footer">
        © 2026 NOWEARSPIN
    </div>

</div>

</body>
</html>
