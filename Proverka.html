<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NowearSpin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Inter, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f0f0f;
    color:#fff;
}

.glow{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:#ffc400;
    filter:blur(140px);
    opacity:.25;
    animation:move 8s ease-in-out infinite;
}

@keyframes move{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(-30px,40px);
    }
}

.card{
    width:90%;
    max-width:380px;
    text-align:center;
    padding:35px 25px;
    border-radius:30px;
    background:rgba(255,196,0,.05);
    border:1px solid rgba(255,196,0,.15);
    backdrop-filter:blur(18px);
    box-shadow:
    0 0 50px rgba(255,196,0,.12),
    inset 0 0 20px rgba(255,196,0,.05);
    z-index:2;
}

.logo{
    font-size:36px;
    font-weight:900;
    color:#ffc400;
    letter-spacing:1px;
}

.line{
    width:60px;
    height:4px;
    background:#ffc400;
    margin:15px auto 25px;
    border-radius:10px;
}

.loader{
    width:80px;
    height:80px;
    margin:0 auto 25px;
    border-radius:50%;
    border:4px solid rgba(255,196,0,.15);
    border-top:4px solid #ffc400;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.title{
    font-size:24px;
    font-weight:700;
    margin-bottom:10px;
}

.text{
    color:#cfcfcf;
    line-height:1.7;
    font-size:15px;
}

.badge{
    display:inline-block;
    margin-top:25px;
    padding:10px 18px;
    border-radius:50px;
    background:#ffc400;
    color:#111;
    font-weight:700;
    font-size:14px;
}

.footer{
    margin-top:20px;
    color:#8a8a8a;
    font-size:12px;
}
</style>
</head>
<body>

<div class="glow"></div>

<div id="auth" class="card">
    <div class="logo">NOWEARSPIN</div>
    <div class="line"></div>

    <div class="title">Доступ для администрации</div>

    <div class="text">
        Введите код администрации, чтобы продолжить.
    </div>

    <input
        type="password"
        id="adminCode"
        placeholder="Введите код"
        style="
        margin-top:20px;
        width:100%;
        padding:12px;
        border-radius:12px;
        border:none;
        outline:none;
        background:#1a1a1a;
        color:white;
        text-align:center;
        font-size:16px;
        ">

    <button
        onclick="checkCode()"
        style="
        margin-top:15px;
        width:100%;
        padding:12px;
        border:none;
        border-radius:12px;
        background:#ffc400;
        color:#111;
        font-weight:700;
        cursor:pointer;
        ">
        Продолжить
    </button>

    <div id="error" style="margin-top:12px;color:#ff4d4d;"></div>
</div>

<div id="main" class="card" style="display:none;">

    <div class="logo">NOWEARSPIN</div>
    <div class="line"></div>

    <div class="loader"></div>

    <div class="title">Технические работы</div>

    <div class="text">
        Мы обновляем платформу и готовим новые возможности.<br>
        Пожалуйста, зайдите немного позже.
    </div>

    <div class="badge">Скоро вернёмся</div>

    <div class="footer">
        © 2026 NowearSpin
    </div>

</div>

<script>
function checkCode() {
    const code = document.getElementById("adminCode").value;

    if (code === "3330") {
        window.location.href = "index.html";
    } else {
        document.getElementById("error").textContent = "Неверный код доступа";
    }
}

document.getElementById("adminCode").addEventListener("keypress", function(e){
    if (e.key === "Enter") {
        checkCode();
    }
});
</script>

</body>
</html>
