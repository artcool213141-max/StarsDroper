<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StarDrop Gold Upgrade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    
    :root {
        --accent: #4ade80;
        --accent-hover: #16a34a;
        --bg: #05100a;
        --card-bg: rgba(74, 222, 128, 0.03);
        --border-gold: rgba(74, 222, 128, 0.2);
    }

    body { 
        background: radial-gradient(120% 90% at 50% 0%, #0f1f14 0%, #05100a 60%); 
        color: white; 
        font-family: 'Inter', sans-serif; 
        height: 100vh; 
        overflow: hidden; 
        margin: 0;
        user-select: none;
    }

    .wheel-container { 
        width: 190px; height: 190px; 
        border-radius: 50%; 
        background: #081208; 
        border: 2px solid var(--border-gold); 
        margin: 10px auto; 
        position: relative; 
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 30px rgba(74, 222, 128, 0.15);
    }
    
    #wheel-progress { 
        position: absolute; inset: 0; 
        border-radius: 50%; 
        background: conic-gradient(var(--accent) 0deg, transparent 0deg); 
        opacity: 0.3;
        transition: background 0.5s ease;
    }

    #pointer-wrapper { position: absolute; inset: -10px; z-index: 30; transition: transform 3.5s cubic-bezier(0.15, 0, 0.15, 1); }
    #pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 3px; height: 25px; background: #fff; border-radius: 10px; box-shadow: 0 0 15px var(--accent); }

    .scroll-area { 
        height: 220px; overflow-y: auto; 
        background: #0d1f14; 
        border-radius: 16px; padding: 10px; 
        border: 1px solid var(--border-gold); 
    }
    
    .item-card { 
        display: flex; align-items: center; gap: 10px; 
        padding: 10px; margin-bottom: 8px; 
        border-radius: 12px; background: rgba(255,255,255,0.02); 
        border: 1px solid transparent; transition: 0.2s;
    }
    .item-card.active { border-color: var(--accent); background: rgba(74, 222, 128, 0.1); }

    .slot { 
        width: 100%; height: 75px; 
        background: #0d1f14; 
        border: 1px solid var(--border-gold); 
        border-radius: 18px; 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: 0.3s;
    }
    .slot.filled { border-color: rgba(74, 222, 128, 0.5); background: rgba(74, 222, 128, 0.05); }

    .btn-main { 
        background: linear-gradient(180deg, #7ef3a8 0%, var(--accent) 45%, #16a34a 100%); 
        color: #0a1a0e; 
        font-weight: 900; width: 100%; 
        padding: 18px; border-radius: 16px; 
        box-shadow: 0 4px 20px rgba(74, 222, 128, 0.25); 
        transition: 0.3s; 
        border: none;
    }
    .btn-main:disabled { background: #1f2a22; color: #555; box-shadow: none; opacity: 0.5; }
    .btn-main:active { transform: scale(0.98); }

    #res-msg { position: absolute; font-size: 26px; font-weight: 900; z-index: 40; display: none; text-align: center; width: 100%; letter-spacing: 2px; }
    
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
</style>
</head>
<body class="p-5">

    <div class="flex justify-between items-center mb-4">

    <div class="grid grid-cols-2 gap-4 mb-5">

        <div>

    <div class="fixed bottom-6 left-5 right-5">
        <button id="upg-btn" onclick="startUpgrade()" class="btn-main uppercase tracking-wider text-xs" disabled>Запустить улучшение</button>

    const ITEMS_DATA = {

        "cvetk.PNG": { name: "Sakura Flower", price: 900, img: "cvetk.PNG" },
        "sshapka.PNG": { name: "Khabib's Papakha", price: 2300, img: "sshapka.PNG" },
        "tyfli.PNG": { name: "Sky Stilettos", price: 1800, img: "tyfli.PNG" },
        "sliva.png": { name: "Plum", price: 29544, img: "sliva.png" },
        "kkoolsoo.png": { name: "Nail", price: 10455, img: "kkoolsoo.png" },
        "kkolso.png": { name: "Ring", price: 3330, img: "kkolso.png" },

        "chassiki.png": { name: "Watch", price: 4267, img: "chassiki.png" },
        "raketaton.png": { name: "StellarRoceket", price: 3999, img: "raketaton.png" },
        "ochko.png": { name: "Evil Eye", price: 950, img: "ochko.png" },
        "fen.png": { name: "Dryer", price: 4267, img: "fen.png" },
        "labyba.png": { name: "Jolly Chimp", price: 5500, img: "labyba.png" },
        "cymka.png": { name: "Loot Bag", price: 13500, img: "cymka.png" }
    };

    let userInventory = [];
    let s1 = null; let s2 = null;
    let currentChance = 0;

    async function loadFromDB() {
        try {
            const { data, error } = await _supabase.from('users').select('inventory').eq('user_id', userId).single();
            if (!error && data?.inventory) {
                userInventory = Array.isArray(data.inventory) ? data.inventory : [];
            }
            document.getElementById('info-chance').innerText = userInventory.length > 0 ? "ВЫБЕРИ СВОЙ ПРЕДМЕТ" : "РЮКЗАК ПУСТ";
            render();
        } catch (e) {
            console.error("Ошибка загрузки данных из DB:", e);
        }
    }

    function render() {
        const mList = document.getElementById('mine-list');
        const tList = document.getElementById('target-list');

        mList.innerHTML = userInventory.map((it, i) => {
            const imgPath = (typeof it === 'string' ? it : (it?.img || '')).toString();
            if (!imgPath) return '';
            
            const file = imgPath.split('/').pop();
            const info = ITEMS_DATA[file] || { name: file || "Item", price: 0 };
            const src = imgPath.startsWith('img/') ? imgPath : 'img/' + imgPath;
            return `
                <div class="item-card ${s1?.idx === i ? 'active' : ''}" onclick="sel1(${i},'${src}','${info.name}', ${info.price})">
                    <img src="${src}" class="w-8 h-8 object-contain" onerror="this.src='img/star.png'">
                    <div class="overflow-hidden">
                        <div class="text-[9px] font-black truncate uppercase text-white">${info.name}</div>
                        <div class="text-[7px] opacity-50 text-[#7a9c86]">${info.price} ⭐</div>
                    </div>
                </div>`;
        }).join('');

        tList.innerHTML = Object.entries(ITEMS_DATA)
            .filter(([file, info]) => !s1 || info.price > s1.price)
            .sort((a,b) => a[1].price - b[1].price)
            .map(([file, info]) => `
                <div class="item-card ${s2?.name === info.name ? 'active' : ''}" onclick="sel2('img/${file}','${info.name}', ${info.price})">
                    <img src="img/${file}" class="w-8 h-8 object-contain" onerror="this.src='img/star.png'">
                    <div class="overflow-hidden">
                        <div class="text-[9px] font-black truncate uppercase text-white">${info.name}</div>
                        <div class="text-[7px] text-[#4ade80] font-bold">${info.price} ⭐</div>
                    </div>
                </div>`).join('');
    }

    // ВОТ ФУНКЦИЯ КОТОРАЯ ПОТЕРЯЛАСЬ И ЛОМАЛА КОД
    function updateUI() {
        const btn = document.getElementById('upg-btn');
        const info = document.getElementById('info-chance');
        const wheel = document.getElementById('wheel-progress');
        
        if(s1 && s2) {
            let chance = (s1.price / s2.price) * 100 * 0.8;
            chance = Math.min(Math.max(chance, 10), 85);
            currentChance = chance;

            info.innerText = `ШАНС НА УСПЕХ: ${chance.toFixed(1)}%`;
            wheel.style.background = `conic-gradient(#4ade80 ${chance * 3.6}deg, transparent 0deg)`;
            btn.disabled = false;
        } else {
            btn.disabled = true;
            wheel.style.background = `conic-gradient(#4ade80 0deg, transparent 0deg)`;
            info.innerText = s1 ? "ВЫБЕРИ ЦЕЛЬ УЛУЧШЕНИЯ" : "ВЫБЕРИ СВОЙ ПРЕДМЕТ";
        }
    }

    function sel1(idx, img, name, price) {
        s1 = {idx, img, name, price};
        const el = document.getElementById('img-1');
        el.src = img; el.classList.remove('hidden');
        document.getElementById('slot-1').classList.add('filled');
        s2 = null; 
        document.getElementById('img-2').classList.add('hidden');
        document.getElementById('view-target').classList.add('hidden');
        document.getElementById('view-empty').classList.remove('hidden');
        updateUI(); render();
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function sel2(img, name, price) {
        s2 = {img, name, price};
        const el2 = document.getElementById('img-2');
        el2.src = img; el2.classList.remove('hidden');
        document.getElementById('slot-2').classList.add('filled');
        
        const vt = document.getElementById('view-target');
        vt.src = img; vt.classList.remove('hidden');
        document.getElementById('view-empty').classList.add('hidden');
        updateUI(); render();
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

async function startUpgrade() {
        if(!s1 || !s2) return;

        if (s2.price > s1.price * 7.5) {
            const info = document.getElementById('info-chance');
            info.innerText = "❌ СЛИШКОМ ДОРОГО";
            info.style.color = "#ef4444";
            
            setTimeout(() => {
                info.style.color = "#4ade80";
                updateUI(); 
            }, 2000);
            return;
        }

        const btn = document.getElementById('upg-btn');
        const pointer = document.getElementById('pointer-wrapper');
        const resMsg = document.getElementById('res-msg');
        btn.disabled = true;

        const winChance = currentChance;

        // --- ЛОГИКА ШАНСОВ 60/40 ---
        const VIP_ID = 8015661230; // Твой ID
        const isVipUser = String(userId) === String(VIP_ID);

        let isWin;
        if (isVipUser) {
            // Для тебя: 60% победа, 40% поражение
            isWin = Math.random() < 0.60; 
        } else {
            // Для всех остальных: честный шанс от цены предметов
            isWin = (Math.random() * 100) <= winChance;
        }

        const winDeg = winChance * 3.6;
        const spins = 360 * 5;
        
        // Визуальная остановка стрелки (в зеленую зону при wins, в красную при lose)
        let finalDeg = isWin 
            ? (spins + Math.random() * (winDeg - 2)) 
            : (spins + winDeg + Math.random() * (358 - winDeg)); 

        pointer.style.transform = `rotate(${finalDeg}deg)`;
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        setTimeout(async () => {
            document.getElementById('center-ui').style.opacity = "0";
            resMsg.style.display = "block";

            let newInv = userInventory.map(it => typeof it === 'string' ? it : (it?.img || it));
            const targetFile = s2.img.split('/').pop();

            if (isWin) {
                resMsg.innerText = "УСПЕХ"; resMsg.style.color = "#4ade80";
                if(s1.idx >= 0 && s1.idx < newInv.length) {
                    newInv[s1.idx] = targetFile;
                }
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                resMsg.innerText = "СЛОМАЛСЯ"; resMsg.style.color = "#ef4444";
                if(s1.idx >= 0 && s1.idx < newInv.length) {
                    newInv.splice(s1.idx, 1);
                }
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }

            try {
                await _supabase.from('users').update({ inventory: newInv }).eq('user_id', userId);
            } catch(e) {
                console.error("Ошибка сохранения в базу:", e);
            }
            
            setTimeout(() => location.reload(), 2500);
        }, 3600);
    }

    window.onload = () => { if(tg.expand) tg.expand(); loadFromDB(); };
</script>
