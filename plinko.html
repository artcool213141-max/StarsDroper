<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NowearSpin Plinko</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0d0a05; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        #plinko-container { width: 400px; height: 500px; }
        .ui-panel { width: 400px; padding: 20px; background: #1a140a; }
        .input-f { background: #050402; border: 1px solid #4a3b14; padding: 12px; width: 100%; text-align: center; color: white; border-radius: 8px; }
        .btn-play { background: #d4af37; color: #0d0a05; font-weight: 900; padding: 15px; width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="p-4 text-center">STARS: <span id="balance">0</span></div>

<div id="plinko-container"></div>

<div class="ui-panel">
    <input id="bet-input" type="number" class="input-f" value="10">
    <button id="drop-btn" onclick="dropBall()" class="btn-play">ИГРАТЬ</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const SB_URL = 'https://xjucalpaoqlrtmofmden.supabase.co';
    const SB_KEY = 'sb_publishable_SaK4-9Ub_yQQez5F-eUq3A_NPx46axx';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    const userId = tg.initDataUnsafe?.user?.id || 8015661230;

    let balance = 0;
    let isDropping = false;
    const multiValues = [5, 0.2, 2, 1.2, 1, 0.5, 1.2, 2, 10];

    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
    const engine = Engine.create();
    const container = document.getElementById('plinko-container');

    const render = Render.create({
        element: container,
        engine: engine,
        options: { width: 400, height: 500, wireframes: false, background: 'transparent' }
    });

    // Добавляем границы, чтобы шарик не улетал
    Composite.add(engine.world, [
        Bodies.rectangle(200, 505, 400, 10, { isStatic: true }), // Пол
        Bodies.rectangle(0, 250, 10, 500, { isStatic: true }), // Левая стена
        Bodies.rectangle(400, 250, 10, 500, { isStatic: true }) // Правая стена
    ]);

    // Пины
    for (let i = 2; i <= 9; i++) {
        for (let j = 0; j < i; j++) {
            Composite.add(engine.world, Bodies.circle(200 + (j - (i - 1) / 2) * 41, 60 + i * 42, 3.5, { isStatic: true, render: { fillStyle: '#4a3b14' } }));
        }
    }

    // Зоны (убедитесь, что они видны)
    for (let i = 0; i < 9; i++) {
        Composite.add(engine.world, Bodies.rectangle(23 + i * 44, 480, 30, 20, { 
            isStatic: true, isSensor: true, label: 'bucket-' + i, 
            render: { fillStyle: '#4a3b14' } 
        }));
    }

    Render.run(render);
    Runner.run(Runner.create(), engine);

    async function syncBalance() {
        const { data } = await supabaseClient.from('users').select('stars').eq('user_id', userId).single();
        if (data) { balance = data.stars; document.getElementById('balance').innerText = Math.floor(balance); }
    }

    function dropBall() {
        if (isDropping) return;
        
        const bet = parseInt(document.getElementById('bet-input').value);
        if (balance < bet) return alert("Недостаточно звезд!");

        isDropping = true;
        document.getElementById('drop-btn').style.opacity = '0.5';
        
        balance -= bet;
        document.getElementById('balance').innerText = Math.floor(balance);

        const ball = Bodies.circle(180 + Math.random() * 40, 10, 8, {
            restitution: 0.6,
            render: { fillStyle: '#d4af37' },
            label: 'ball', betAmount: bet
        });

        Composite.add(engine.world, ball);
    }

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach((pair) => {
            if (pair.bodyB.label === 'ball' && pair.bodyA.label.startsWith('bucket-')) {
                const idx = parseInt(pair.bodyA.label.split('-')[1]);
                const win = Math.floor(pair.bodyB.betAmount * multiValues[idx]);
                
                Composite.remove(engine.world, pair.bodyB);
                
                balance += win;
                document.getElementById('balance').innerText = Math.floor(balance);
                supabaseClient.from('users').update({ stars: balance }).eq('user_id', userId).then();
                
                isDropping = false;
                document.getElementById('drop-btn').style.opacity = '1';
            }
        });
    });

    window.onload = () => { syncBalance(); tg.expand(); };
</script>
</body>
</html>
