<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NowearSpin Plinko</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0d0a05; color: white; margin: 0; height: 100vh; position: fixed; width: 100%; overflow: hidden; }
        #game-view { width: 100%; height: 400px; position: relative; }
        .ui-panel { background: #1a140a; padding: 20px; border-top: 2px solid #4a3b14; position: absolute; bottom: 0; width: 100%; }
        .btn-play { background: #d4af37; color: #0d0a05; font-weight: 900; padding: 18px; border-radius: 12px; width: 100%; text-transform: uppercase; transition: opacity 0.2s; }
        .btn-play:disabled { opacity: 0.3; cursor: not-allowed; }
        .input-f { background: #050402; border: 1px solid #4a3b14; padding: 12px; border-radius: 12px; color: white; width: 100%; text-align: center; }
        .mult-row { display: flex; justify-content: space-around; width: 100%; color: #d4af37; font-size: 10px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<header class="p-4 flex justify-between items-center text-sm">
    <div class="font-black text-[#d4af37]">NowearSpin</div>
    <div>STARS: <span id="v-stars">0</span> | TON: <span id="v-ton">0.00</span></div>
</header>

<div class="mult-row"><span>5x</span><span>1.5x</span><span>0.5x</span><span>0.2x</span><span>0.1x</span><span>0.2x</span><span>0.5x</span><span>1.5x</span><span>5x</span></div>
<div id="game-view"></div>

<div id="panel" class="ui-panel">
    <div class="flex gap-2 mb-3">
        <button id="m-stars" onclick="setMode('stars')" class="bg-[#3d300f] border border-[#d4af37] p-2 rounded-lg flex-1">STARS</button>
        <button id="m-balance" onclick="setMode('balance')" class="bg-[#21190a] p-2 rounded-lg flex-1">TON</button>
    </div>
    <input id="bet" type="number" class="input-f mb-3" value="10">
    <button id="btn" onclick="dropBall()" class="btn-play">ИГРАТЬ</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const SB_URL = 'https://xjucalpaoqlrtmofmden.supabase.co';
    const SB_KEY = 'sb_publishable_SaK4-9Ub_yQQez5F-eUq3A_NPx46axx';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    const userId = tg.initDataUnsafe?.user?.id || 8015661230;

    let balance = 0;
    let isDropping = false; // Флаг блокировки
    const multiValues = [0.1, 0.2, 0.5, 0.1, 0.1, 0.2, 0.5, 0.2, 0.1];

    const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
    const engine = Engine.create();
    const container = document.getElementById('plinko-container');

    const render = Render.create({
        element: container,
        engine: engine,
        options: { width: 400, height: 500, wireframes: false, background: 'transparent', pixelRatio: window.devicePixelRatio }
    });

    // Стены
    Composite.add(engine.world, [
        Bodies.rectangle(0, 250, 20, 500, { isStatic: true, render: { visible: false } }),
        Bodies.rectangle(400, 250, 20, 500, { isStatic: true, render: { visible: false } })
    ]);

    // Пины
    for (let i = 2; i <= 9; i++) {
        for (let j = 0; j < i; j++) {
            const x = 200 + (j - (i - 1) / 2) * 41;
            const y = 60 + i * 42;
            Composite.add(engine.world, Bodies.circle(x, y, 3.5, { isStatic: true, render: { fillStyle: '#4a3b14' } }));
        }
    }

    // Зоны
    for (let i = 0; i < 9; i++) {
        const x = 32 + i * 42;
        Composite.add(engine.world, Bodies.rectangle(x, 490, 38, 40, { isStatic: true, isSensor: true, label: `bucket-${i}`, render: { visible: false } }));
    }

    Render.run(render);
    Runner.run(Runner.create(), engine);

    async function syncBalance() {
        const { data } = await supabaseClient.from('users').select('stars').eq('user_id', userId).single();
        if (data) { balance = data.stars; document.getElementById('balance').innerText = Math.floor(balance); }
    }

    function dropBall() {
        if (isDropping) return; // Блокировка, если шарик уже есть
        
        const bet = parseInt(document.getElementById('bet-input').value);
        if (balance < bet) return tg.showAlert("Недостаточно звезд!");

        isDropping = true;
        document.getElementById('drop-btn').style.opacity = '0.5';
        
        balance -= bet;
        document.getElementById('balance').innerText = Math.floor(balance);

        // УБИЙСТВЕННЫЕ ШАНСЫ: Спавним всегда в левой части (зона 0.2x, 0.5x, 1x)
        const spawnX = 170 + (Math.random() * 20); 

        const ball = Bodies.circle(spawnX, 10, 8, {
            restitution: 0.5, friction: 0.02, frictionAir: 0.04,
            render: { fillStyle: '#d4af37', strokeStyle: '#fff', lineWidth: 2 },
            label: 'ball', betAmount: bet
        });

        Composite.add(engine.world, ball);
        tg.HapticFeedback.impactOccurred('medium');
    }

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(async (pair) => {
            const { bodyA, bodyB } = pair;
            if (bodyB.label === 'ball' && bodyA.label.startsWith('bucket-')) {
                const idx = parseInt(bodyA.label.split('-')[1]);
                const win = Math.floor(bodyB.betAmount * multiValues[idx]);
                
                Composite.remove(engine.world, bodyB);
                
                balance += win;
                document.getElementById('balance').innerText = Math.floor(balance);
                await supabaseClient.from('users').update({ stars: balance }).eq('user_id', userId);
                
                tg.HapticFeedback.notificationOccurred(win >= bodyB.betAmount ? 'success' : 'warning');
                
                // Разблокируем кнопку
                isDropping = false;
                document.getElementById('drop-btn').style.opacity = '1';
            }
        });
    });

    window.onload = () => { syncBalance(); tg.expand(); };
</script>
</body>
</html>
