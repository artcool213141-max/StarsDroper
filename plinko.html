<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NowearSpin - Plinko</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #d4af37; --bg: #0d0a05; --panel-bg: #1a140a; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #plinko-container { width: 100%; height: 50vh; position: relative; }
        .ui-panel { background: var(--panel-bg); padding: 20px; border-radius: 24px 24px 0 0; border-top: 2px solid rgba(212, 175, 55, 0.3); }
        .btn-main { background: var(--accent); color: #0d0a05; font-weight: 900; padding: 18px; border-radius: 16px; width: 100%; text-transform: uppercase; }
        .btn-main:disabled { opacity: 0.5; filter: grayscale(1); }
        .input-box { background: #050402; border: 1px solid #4a3b14; padding: 12px; border-radius: 12px; color: white; text-align: center; width: 100%; outline: none; }
    </style>
</head>
<body>

<header class="flex justify-between p-5">
    <div class="font-black text-[#d4af37] text-xl">Nowear<span class="text-white">Spin</span></div>
    <div class="flex gap-4 font-bold text-sm">
        <div>STARS: <span id="val-stars">0</span></div>
        <div>TON: <span id="val-ton">0.00</span></div>
    </div>
</header>

<div id="plinko-container"></div>

<aside class="ui-panel mt-auto">
    <div class="flex gap-3 mb-4">
        <input id="input-bet" type="number" class="input-box" value="10">
        <select id="cur-select" class="input-box w-1/3">
            <option value="stars">STARS</option>
            <option value="balance">TON</option>
        </select>
    </div>
    <button id="btn-main" onclick="onDrop()" class="btn-main">СБРОСИТЬ ШАРИК</button>
</aside>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    // ИСПОЛЬЗУЙ СВОИ КЛЮЧИ ИЗ MINES (ОНИ ОДИНАКОВЫЕ ДЛЯ ПРОЕКТА)
    const SB = supabase.createClient("https://xjucalpaoqlrtmofmden.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqdWNhbHBhb3FscnRtb2ZtZGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDIzODcsImV4cCI6MjA5MjAxODM4N30.3jfEF1lSa1YTBYgc4O8ZtJVpfkJN9SBGmqYn8-Sn7Zo");
    
    let isPlaying = false;
    const userId = tg.initDataUnsafe?.user?.id || 12345;
    
    const { Engine, Render, Bodies, Composite, Events, Runner } = Matter;
    const engine = Engine.create();
    const render = Render.create({ element: document.getElementById('plinko-container'), engine, options: { width: 400, height: 400, wireframes: false, background: 'transparent' } });

    // Генерация поля
    for (let i = 2; i <= 9; i++) {
        for (let j = 0; j < i; j++) {
            Composite.add(engine.world, Bodies.circle(200 + (j - (i - 1) / 2) * 41, 60 + i * 42, 4, { isStatic: true, render: { fillStyle: '#4a3b14' } }));
        }
    }
    for (let i = 0; i < 9; i++) {
        Composite.add(engine.world, Bodies.rectangle(32 + i * 42, 490, 38, 40, { isStatic: true, isSensor: true, label: `bucket-${i}` }));
    }
    Render.run(render); Runner.run(Runner.create(), engine);

    async function syncBalances() {
        const { data } = await SB.from('users').select('*').eq('user_id', userId).single();
        if (data) {
            document.getElementById('val-stars').innerText = Math.floor(data.stars || 0);
            document.getElementById('val-ton').innerText = Number(data.balance || 0).toFixed(2);
        }
    }

    async function onDrop() {
        if (isPlaying) return;
        
        const bet = Number(document.getElementById('input-bet').value);
        const col = document.getElementById('cur-select').value;

        const { data: user } = await SB.from('users').select(col).eq('user_id', userId).single();
        if (!user || user[col] < bet) return tg.showAlert("Недостаточно средств!");

        await SB.from('users').update({ [col]: user[col] - bet }).eq('user_id', userId);
        syncBalances();

        isPlaying = true;
        document.getElementById('btn-main').disabled = true;

        // "Плохие шансы": спавним шарик ближе к краям, где множители 0.2x
        const spawnX = 180 + Math.random() * 40;
        const ball = Bodies.circle(spawnX, 10, 8, { label: 'ball', bet: bet, col: col });
        Composite.add(engine.world, ball);
    }

    Events.on(engine, 'collisionStart', async (e) => {
        e.pairs.forEach(async (pair) => {
            if (pair.bodyB.label === 'ball' && pair.bodyA.label.startsWith('bucket')) {
                const multipliers = [5, 0.2, 1.5, 0.5, 0.2, 0.5, 1.5, 0.2, 5];
                const mult = multipliers[parseInt(pair.bodyA.label.split('-')[1])];
                const win = pair.bodyB.bet * mult;

                const { data: user } = await SB.from('users').select(pair.bodyB.col).eq('user_id', userId).single();
                await SB.from('users').update({ [pair.bodyB.col]: user[pair.bodyB.col] + win }).eq('user_id', userId);

                Composite.remove(engine.world, pair.bodyB);
                isPlaying = false;
                document.getElementById('btn-main').disabled = false;
                syncBalances();
            }
        });
    });

    syncBalances();
</script>
</body>
</html>
