<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NowearSpin Plinko</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #0d0a05; color: white; margin: 0; 
            height: 100vh; display: flex; flex-direction: column; 
            overflow: hidden; position: fixed; width: 100%;
        }
        #game-container { flex: 1; width: 100%; position: relative; }
        .footer { 
            background: #1a140a; padding: 20px; 
            border-top: 1px solid #4a3b14; z-index: 100;
        }
        .btn { 
            background: #d4af37; color: #0d0a05; font-weight: 900; 
            padding: 16px; border-radius: 12px; width: 100%; 
            text-transform: uppercase; transition: 0.2s;
        }
        .btn:disabled { opacity: 0.3; }
        .input-box { background: #050402; border: 1px solid #4a3b14; padding: 12px; border-radius: 8px; color: white; width: 100%; }
    </style>
</head>
<body>

<div id="game-container"></div>

<div class="footer">
    <div class="flex gap-2 mb-3">
        <input id="bet" type="number" class="input-box" value="10">
        <select id="cur" class="input-box w-1/3">
            <option value="stars">STARS</option>
            <option value="balance">TON</option>
        </select>
    </div>
    <button id="btn" onclick="executeGame()" class="btn">СБРОСИТЬ ШАРИК</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const SB = supabase.createClient("https://xjucalpaoqlrtmofmden.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqdWNhbHBhb3FscnRtb2ZtZGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDIzODcsImV4cCI6MjA5MjAxODM4N30.3jfEF1lSa1YTBYgc4O8ZtJVpfkJN9SBGmqYn8-Sn7Zo");
    const uid = tg.initDataUnsafe?.user?.id || 12345;

    let busy = false;
    const { Engine, Render, Bodies, Composite, Events, Runner } = Matter;
    const engine = Engine.create();
    const render = Render.create({ 
        element: document.getElementById('game-container'), 
        engine, options: { width: 400, height: 400, wireframes: false, background: 'transparent' } 
    });

    // Генерация мира
    for (let i = 2; i <= 9; i++) {
        for (let j = 0; j < i; j++) {
            Composite.add(engine.world, Bodies.circle(200 + (j - (i - 1) / 2) * 41, 60 + i * 42, 4, { isStatic: true, render: { fillStyle: '#4a3b14' } }));
        }
    }
    for (let i = 0; i < 9; i++) {
        Composite.add(engine.world, Bodies.rectangle(32 + i * 42, 380, 38, 20, { isStatic: true, isSensor: true, label: `b-${i}` }));
    }

    Render.run(render); Runner.run(Runner.create(), engine);

    async function executeGame() {
        // Гасим клавиатуру принудительно
        document.getElementById('bet').blur();
        
        if (busy) return;
        const val = Number(document.getElementById('bet').value);
        const col = document.getElementById('cur').value;

        const { data: u } = await SB.from('users').select(col).eq('user_id', uid).single();
        if (!u || u[col] < val) return tg.showAlert("Мало денег");

        await SB.from('users').update({ [col]: u[col] - val }).eq('user_id', uid);

        busy = true;
        document.getElementById('btn').disabled = true;

        const ball = Bodies.circle(180 + Math.random() * 40, 10, 8, { label: 'ball', bet: val, col: col });
        Composite.add(engine.world, ball);
    }

    Events.on(engine, 'collisionStart', async (e) => {
        for (let pair of e.pairs) {
            if (pair.bodyB.label === 'ball' && pair.bodyA.label.startsWith('b-')) {
                const m = [5, 0.2, 1.5, 0.5, 0.2, 0.5, 1.5, 0.2, 5][parseInt(pair.bodyA.label.split('-')[1])];
                const win = Math.floor(pair.bodyB.bet * m);

                const { data: u } = await SB.from('users').select(pair.bodyB.col).eq('user_id', uid).single();
                await SB.from('users').update({ [pair.bodyB.col]: u[pair.bodyB.col] + win }).eq('user_id', uid);

                Composite.remove(engine.world, pair.bodyB);
                busy = false;
                document.getElementById('btn').disabled = false;
            }
        }
    });
</script>
</body>
</html>
