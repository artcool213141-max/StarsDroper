<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NowearSpin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .game-card {
            background: linear-gradient(135deg, #1c1c1c 0%, #121212 100%);
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 16px;
            margin: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .online-badge { color: #4ade80; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .online-badge::before { content: '●'; font-size: 10px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 65px; background: #0f0f0f; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #888; }
        .nav-item.active { color: #d4af37; }
    </style>
</head>
<body class="pb-24">

    <div class="px-5 py-4 flex justify-between items-center">
        <span class="online-badge">49 онлайн</span>
        <button>⋮</button>
    </div>

    <div id="games">
        <div class="game-card" onclick="launch('mines.html')">
            <div>
                <div class="online-badge">12 онлайн</div>
                <h2 class="text-lg font-bold">Mines</h2>
                <p class="text-gray-400 text-xs">Найди свою удачу</p>
            </div>
            <div class="w-14 h-14 bg-gray-800 rounded-xl flex items-center justify-center">💣</div>
        </div>

        <div class="game-card" onclick="launch('plinko.html')">
            <div>
                <div class="online-badge">15 онлайн</div>
                <h2 class="text-lg font-bold">Plinko</h2>
                <p class="text-gray-400 text-xs">Приумножь свой баланс</p>
            </div>
            <div class="w-14 h-14 bg-gray-800 rounded-xl flex items-center justify-center">🔻</div>
        </div>

        <div class="game-card" onclick="launchWithPayment('Lovlyagift.html')">
            <div>
                <div class="online-badge">13 онлайн</div>
                <h2 class="text-lg font-bold">Catcher</h2>
                <p class="text-gray-400 text-xs">Лови свои подарки</p>
            </div>
            <div class="w-14 h-14 bg-yellow-600/20 rounded-xl flex items-center justify-center text-yellow-500">🎁</div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item">⚔️<span>ПвП</span></div>
        <div class="nav-item active">●<span>Соло</span></div>
        <div class="nav-item">🎁<span>Розыгрыши</span></div>
        <div class="nav-item">🛒<span>Магазин</span></div>
        <div class="nav-item">👤<span>Профиль</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const SB = supabase.createClient("https://xjucalpaoqlrtmofmden.supabase.co", "sb_publishable_SaK4-9Ub_yQQez5F-eUq3A_NPx46axx");
        const userId = tg.initDataUnsafe?.user?.id;

        async function launchWithPayment(file) {
            if (!userId) { alert("Ошибка авторизации"); return; }
            try {
                const { data } = await SB.from('users').select('stars').eq('user_id', userId).single();
                if ((data?.stars || 0) < 100) {
                    alert("Недостаточно звезд! Нужно 100.");
                    return;
                }
                if (confirm("Вход в игру стоит 100 звезд. Продолжить?")) {
                    await SB.from('users').update({ stars: data.stars - 100 }).eq('user_id', userId);
                    window.location.replace("./" + file);
                }
            } catch (e) {
                console.error(e);
                alert("Ошибка сервера");
            }
        }

        function launch(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
